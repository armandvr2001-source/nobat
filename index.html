<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نوبت‌دهی دکتر فرزانه علی‌حسینی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4f9;--surface:#fff;--text:#1b2237;--muted:#5d667f;--line:#d9deeb;--ink:#2a3a73;--ink-text:#fff;--ok:#1f7a4d;--bad:#b3392f;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12162a;--surface:#1b2038;--text:#eceffa;--muted:#9aa3c0;--line:#2e3555;--ink:#8d9dff;--ink-text:#10142a;--ok:#5fd09a;--bad:#ff8b80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12162a;--surface:#1b2038;--text:#eceffa;--muted:#9aa3c0;--line:#2e3555;--ink:#8d9dff;--ink-text:#10142a;--ok:#5fd09a;--bad:#ff8b80;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Vazirmatn",Tahoma,sans-serif;line-height:1.7}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}
.stripe{height:6px;border-radius:3px;background:linear-gradient(90deg,#2a3a73 0 30%,#b3392f 30% 45%,#d9a43a 45% 60%,#1f7a4d 60% 80%,#6b4fa0 80%);margin-bottom:18px}
h1{font-size:1.5rem;font-weight:800;margin:0}
.sub{color:var(--muted);margin:2px 0 18px;font-size:.95rem}
.tabs{display:flex;gap:6px;margin-bottom:16px}
.tabs button{flex:1;padding:10px;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:10px;font:inherit;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--ink-text);border-color:var(--ink)}
h2{font-size:1rem;margin:20px 0 8px}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.day,.slot{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;font:inherit;cursor:pointer}
.day{flex:0 0 auto;min-width:92px;padding:8px 10px;text-align:center}
.day small{display:block;color:var(--muted)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.slot{padding:12px 8px}
.day[aria-pressed="true"],.slot[aria-pressed="true"]{background:var(--ink);color:var(--ink-text);border-color:var(--ink)}
.day[aria-pressed="true"] small{color:inherit}
.slot:disabled{opacity:.45;text-decoration:line-through;cursor:not-allowed}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
label{display:block;margin:10px 0 4px;font-size:.9rem}
input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);font:inherit}
.go{width:100%;margin-top:16px;padding:14px;border:0;border-radius:12px;background:var(--ink);color:var(--ink-text);font:inherit;font-weight:600;cursor:pointer}
.go:disabled{opacity:.5;cursor:not-allowed}
.msg{margin-top:12px;padding:12px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.err{color:var(--bad)}
.sms{margin-top:8px;padding:12px;border-radius:12px;background:var(--bg);border:1px dashed var(--line);white-space:pre-line;font-size:.9rem}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px;margin-bottom:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.row button{border:1px solid var(--bad);color:var(--bad);background:transparent;border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
.note{color:var(--muted);font-size:.8rem;margin-top:24px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="stripe"></div>
  <h1>دکتر فرزانه علی‌حسینی</h1>
  <p class="sub">رزرو نوبت مشاوره (هر جلسه یک ساعت)</p>

  <div class="tabs" role="tablist">
    <button role="tab" id="t1" aria-selected="true">رزرو نوبت</button>
    <button role="tab" id="t2" aria-selected="false">پنل استاد</button>
  </div>

  <section id="p1">
    <h2>روز را انتخاب کنید</h2>
    <div class="days" id="days"></div>
    <h2>ساعت را انتخاب کنید</h2>
    <div class="slots" id="slots"></div>
    <label for="nm">نام و نام خانوادگی</label>
    <input id="nm" autocomplete="name">
    <label for="ph">شماره موبایل</label>
    <input id="ph" inputmode="tel" placeholder="۰۹۱۲۳۴۵۶۷۸۹" autocomplete="tel">
    <button class="go" id="go" disabled>ثبت نوبت</button>
    <div id="out" aria-live="polite"></div>
  </section>

  <section id="p2" hidden>
    <h2>نوبت‌های ثبت‌شده</h2>
    <div id="login"><label for="pw">رمز ورود</label><input id="pw" type="password" autocomplete="current-password"><button class="go" id="lg">ورود</button><p class="err" id="lerr"></p></div>
    <div id="list"></div>
  </section>

  <p class="note">روزهای کاری: یکشنبه تا چهارشنبه، ساعت ۹ تا ۱۰، ۱۳:۳۰ تا ۱۴:۳۰ و ۱۵:۳۰ تا ۱۶:۳۰.</p>
</div>
<script>
const WORK=[0,1,2,3];
const SLOTS=[["09:00","10:00"],["13:30","14:30"],["15:30","16:30"]];
const fa=n=>String(n).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]);
const en=s=>s.replace(/[۰-۹]/g,d=>d.charCodeAt(0)-1776).replace(/[٠-٩]/g,d=>d.charCodeAt(0)-1632);
const fmtD=new Intl.DateTimeFormat("fa-IR-u-ca-persian",{weekday:"long",day:"numeric",month:"long"});
const fmtW=new Intl.DateTimeFormat("fa-IR-u-ca-persian",{weekday:"long"});
const fmtM=new Intl.DateTimeFormat("fa-IR-u-ca-persian",{day:"numeric",month:"long"});
const key=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=id=>document.getElementById(id);
let bk=[],selD=null,selS=null,pw="";
const days=[];
for(let i=0;i<21;i++){const d=new Date();d.setDate(d.getDate()+i);if(WORK.includes(d.getDay()))days.push(d)}

async function api(path,body){
  try{
    const r=await fetch(path,body?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}:undefined);
    let j={};try{j=await r.json()}catch(e){}
    return{ok:r.ok,status:r.status,j};
  }catch(e){return{ok:false,status:0,j:{}}}
}
async function loadTaken(){const r=await api("/api/slots");if(r.ok){bk=r.j.taken||[];renderSlots()}}

function isPast(d,s){const [h,m]=s[0].split(":");const t=new Date(d);t.setHours(+h,+m,0,0);return t<new Date()}
function taken(d,i){return bk.some(b=>b.d===key(d)&&b.s===i)}
function renderDays(){
  $("days").innerHTML=days.map((d,i)=>`<button class="day" data-i="${i}" aria-pressed="${selD===i}">${fmtW.format(d)}<small>${fmtM.format(d)}</small></button>`).join("");
}
function renderSlots(){
  if(selD===null){$("slots").innerHTML='<p class="sub">ابتدا یک روز را انتخاب کنید.</p>';return}
  const d=days[selD];
  $("slots").innerHTML=SLOTS.map((s,i)=>{
    const off=taken(d,i)||isPast(d,s);
    return `<button class="slot" data-i="${i}" ${off?"disabled":""} aria-pressed="${selS===i}">${fa(s[0])} تا ${fa(s[1])}</button>`}).join("");
}
function check(){$("go").disabled=!(selD!==null&&selS!==null&&$("nm").value.trim().length>2&&/^09\d{9}$/.test(en($("ph").value.trim())))}

$("days").onclick=e=>{const b=e.target.closest(".day");if(!b)return;selD=+b.dataset.i;selS=null;renderDays();renderSlots();check()};
$("slots").onclick=e=>{const b=e.target.closest(".slot");if(!b||b.disabled)return;selS=+b.dataset.i;renderSlots();check()};
$("nm").oninput=$("ph").oninput=check;

$("go").onclick=async()=>{
  const d=days[selD],s=SLOTS[selS];
  $("go").disabled=true;
  const r=await api("/api/book",{day:key(d),slot:selS,name:$("nm").value.trim(),phone:en($("ph").value.trim())});
  if(r.ok){
    $("out").innerHTML=`<div class="msg"><strong style="color:var(--ok)">نوبت ثبت شد.</strong><br>${esc(fmtD.format(d))}، ساعت ${fa(s[0])} تا ${fa(s[1])}</div>`;
    $("nm").value="";$("ph").value="";
  }else{
    const t=r.status===409?"این ساعت همین حالا رزرو شد. ساعت دیگری انتخاب کنید.":r.status===429?"برای این شماره بیش از دو نوبت فعال ثبت شده است.":"ثبت نوبت انجام نشد. دوباره تلاش کنید.";
    $("out").innerHTML=`<div class="msg err">${t}</div>`;
  }
  selS=null;await loadTaken();renderSlots();check();
};

async function renderList(){
  const r=await api("/api/admin",{password:pw,action:"list"});
  if(!r.ok){pw="";$("login").hidden=false;$("list").innerHTML="";$("lerr").textContent=r.status===401?"رمز اشتباه است.":"خطا در دریافت لیست.";return}
  $("login").hidden=true;$("lerr").textContent="";
  const items=r.j.items||[];
  $("list").innerHTML=items.length?items.map(b=>{
    const d=new Date(b.day+"T12:00:00");
    return `<div class="row"><div><strong>${esc(b.name)}</strong><br><span class="sub">${esc(fmtD.format(d))}، ${fa(SLOTS[b.slot][0])} تا ${fa(SLOTS[b.slot][1])}<br>${fa(esc(b.phone))}</span></div><button data-id="${b.id}">لغو</button></div>`}).join(""):'<p class="sub">هنوز نوبتی ثبت نشده است.</p>';
}
$("lg").onclick=()=>{pw=$("pw").value;$("pw").value="";renderList()};
$("list").onclick=async e=>{
  const b=e.target.closest("button");if(!b||!confirm("این نوبت لغو شود؟"))return;
  await api("/api/admin",{password:pw,action:"cancel",id:b.dataset.id});
  renderList();loadTaken();
};

function tab(n){
  $("p1").hidden=n!==1;$("p2").hidden=n!==2;
  $("t1").setAttribute("aria-selected",n===1);$("t2").setAttribute("aria-selected",n===2);
  if(n===2&&pw)renderList();
}
$("t1").onclick=()=>tab(1);$("t2").onclick=()=>tab(2);
renderDays();renderSlots();loadTaken();
</script>
</body>
</html>
